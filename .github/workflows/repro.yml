name: Validate TypeScript 7 ESLint workaround

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: ESLint with TS6 peer and TS7 compiler alias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Show installed package versions
        run: npm run versions

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript 7 compiler
        run: npm run tsc7
